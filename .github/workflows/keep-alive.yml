
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Render service
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 150 \
            "https://YOUR-RENDER-URL.onrender.com/"
