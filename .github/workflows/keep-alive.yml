name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions: {}                # no repository access needed

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render service
        env:
          URL: https://telegram-passive-recon-bot.onrender.com/health
        run: |
          # --max-time 120 gives a sleeping service time to wake up (50-60 s).
          # HEAD request and discarded body, so the response size does not matter.
          curl --silent --show-error --head --max-time 120 --retry 2 --retry-delay 10 "$URL" || true
